<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CV Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root{--a:#4a3fd0;--t:#ecebff;--ink:#14142b;--f:'Geist','Noto Sans Thai',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--f);background:#fff;color:var(--ink);min-height:100vh;padding-bottom:140px;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;transition:transform .12s,background .2s}
button:active{transform:scale(.94)}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px}

.dl{background:#fff;border:1px solid #e3e3e0;border-radius:16px;width:52px;height:52px;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 18px #1b2a5014}
.dl svg{width:24px;height:24px}
.scroll{overflow:auto;padding:0 12px}
.stage{margin:calc(14px + env(safe-area-inset-top,0px)) auto 0;position:relative}
.paper{width:794px;min-height:1123px;background:#fff;transform-origin:0 0;position:absolute;left:0;top:0;padding:46px 46px 60px;font-size:13px;line-height:1.5;color:var(--ink);border-radius:6px;contain:layout style;border:1px solid #e3e3e0;box-shadow:0 2px 4px #0000000d,0 24px 60px #00000026}
.ed{outline:0;display:inline-block;min-width:8px;white-space:pre-wrap}
div.ed,li.ed{display:block}
body.edit .ed:empty:before{content:attr(data-ph);color:#9a9aa8}
body.edit .ed{border-radius:3px;transition:background .15s}body.edit .ed:hover{background:var(--t)}body.edit .ed:focus{background:#fff;box-shadow:0 0 0 2px var(--a);}
body:not(.edit) .ed:empty{display:none}
.add,.x,.ph .up{display:none}
body.edit .add{display:inline-block}
body.edit .x{display:inline-block}
.add{border:1px dashed #aaa;background:#fff;border-radius:5px;padding:3px 9px;font:inherit;font-size:11px;color:#444;cursor:pointer;margin-top:8px}
.x{border:0;background:#fee;color:#c33;border-radius:50%;width:18px;height:18px;line-height:16px;font-size:12px;cursor:pointer;padding:0;margin-left:6px}
h1{margin:0;font-size:30px;line-height:1.25;font-weight:800;letter-spacing:-.02em}
.sub{font-size:13px;margin-top:6px}
.sec{font-weight:700;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin:26px 0 10px}
.muted{color:#777}.sm{font-size:11px}
.pill{background:var(--a);color:#fff;border-radius:99px;padding:2px 12px;font-size:10px}
.l9 .hd{display:flex;justify-content:space-between}
.l9 .rt{text-align:right;font-size:10.5px;color:#777;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{border:1px solid #e6e6ee;border-radius:8px;padding:10px;background:#fff}
.ph{height:150px;border-radius:6px;background:var(--t);display:grid;place-items:center;font-size:11px;background-size:cover;background-position:center}
body.edit .ph{cursor:pointer}
.ph:empty{}
.ph .lbl{display:none}
body.edit .ph:not(.has) .lbl{display:block}
.chip{border:1px solid var(--a);color:#666;border-radius:4px;padding:1px 7px;font-size:10px;margin:0 6px 6px 0}
.l9 .chip{background:#fff}
.role{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-weight:700}
.role .c{font-weight:400;color:#555;font-size:11px}
ul{margin:6px 0 0;padding-left:14px;color:#555;font-size:11.5px}
.edrow{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:11.5px}
.l10 .grid{display:grid;grid-template-columns:1.65fr 1fr;gap:10px}
.l10 .box{border:1px solid #e6e6ee;padding:16px;background:#fff}
.l10 .box.c{background:var(--t);border-top:3px solid var(--a);font-size:10.5px;color:#777;display:flex;flex-direction:column;gap:4px}
.l10 .n{font-weight:600;font-size:8.5px;letter-spacing:1.5px;color:#777;text-transform:uppercase;margin-bottom:8px}
.l10 h1{font-size:30px;margin:12px 0}
.l10 .ttl{color:var(--a);font-weight:700;font-size:12px}
.l10 .h{font-weight:700;font-size:12px;margin-bottom:10px}
.l10 .chip{background:var(--t);border:0;color:#555;display:block;margin:0 0 5px;width:fit-content}
.l10 .when{display:inline-block;background:var(--t);padding:1px 6px;font-size:9px;color:#666;margin-right:4px}
.l10 .co{color:#8a7fdc;font-size:11px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.dock>*{pointer-events:auto;width:100%;max-width:420px}
.nav{background:#ffffffd9;border:1px solid #e9e9e6;box-shadow:0 6px 24px #0000001a;border-radius:20px;padding:6px 8px;display:flex;align-items:center;justify-content:space-between;width:fit-content;gap:8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav button{width:44px;height:38px;border-radius:12px;border:0;background:#f3f3f1;font-size:22px;cursor:pointer;box-shadow:0 1px 4px #0001}
.nav .code{background:#ddd;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:700;letter-spacing:.5px}
.nav b{font-size:14px}
.bar{background:#ffffffd9;border:1px solid #e9e9e6;box-shadow:0 6px 24px #0000001a;border-radius:20px;display:flex;justify-content:space-around;padding:6px 4px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar button{background:none;border:0;font:inherit;font-size:11px;font-weight:500;flex:1;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink)}
.bar svg{width:21px;height:21px}
.bar .on{color:var(--a)}
.modal{position:fixed;inset:0;background:#10183a40;display:flex;opacity:0;pointer-events:none;transition:opacity .2s;align-items:flex-end;justify-content:center;z-index:9}
.modal.show{opacity:1;pointer-events:auto}
.sheet{transform:translateY(24px);transition:transform .25s ease}.modal.show .sheet{transform:none}
.fo{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid #e5e7ee;border-radius:12px;background:#fff;margin-bottom:8px;font-size:16px;cursor:pointer;color:var(--ink)}.fo.on{border-color:var(--a);background:var(--t)}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:20px}
.sheet textarea{width:100%;height:210px;border:1px solid #ccd;border-radius:12px;padding:12px;font:inherit;font-size:14px;resize:vertical}
.btn{background:var(--a);color:#fff;border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:700;font-size:16px;width:100%;margin-top:10px;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.g{background:#eee;color:#333}
.st{font-size:13px;margin-top:8px;color:#555;min-height:18px}
.sw{display:flex;gap:14px;margin:14px 0;flex-wrap:wrap}
.sw i{width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1px #ccc}
#ats{display:none}

/* glass / warm taupe style */
:root{--ink:#2b2621;--f:'Outfit','Noto Sans Thai',system-ui,sans-serif}
body{background:#fffdf9}
body:before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 45% at 80% 6%,#f1eadf 0,#f1eadf00 70%),radial-gradient(60% 40% at 8% 75%,#a68a6e 0,#a68a6e00 70%),linear-gradient(180deg,#dcd4c8,#bfb4a4)}
.paper{background:#fffdf9;border:1px solid #ffffffb3;box-shadow:0 2px 6px #3c2d1e1f,0 28px 60px #3c2d1e40}
h1,.l10 h1{font-weight:600}
.sec{font-weight:600}
.nav,.bar{background:#ffffff4d;border:1px solid #ffffff80;border-radius:26px;box-shadow:0 10px 30px #46372826,inset 0 1px 0 #ffffff66;backdrop-filter:blur(20px) saturate(1.25);-webkit-backdrop-filter:blur(20px) saturate(1.25);color:#2b2621}
.nav button{background:#ffffff73;color:#2b2621}
.nav .code{background:#ffffff66;color:#3b342c;font-weight:500}
.bar button{position:relative;color:#3b342c;font-weight:400;border-radius:16px}
.bar svg{stroke-width:1.6}
.bar .on{background:#ffffff8c;color:#1f1b16}
.bar .on:after{content:'';position:absolute;top:7px;right:9px;width:5px;height:5px;border-radius:50%;background:#7ed321}
.modal{background:#3c30244d}
.sheet{background:#f8f4eed9;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid #ffffff99;border-radius:30px 30px 0 0}
.sheet textarea{background:#ffffffb3;border-color:#78645040}
.fo{background:#ffffff99;border-color:#78645033}
.btn.g{background:#ffffffb3}

/* mulberry background */
body{background:#5f1f4c}
body:before{background:radial-gradient(70% 45% at 80% 6%,#8a3a72 0,#8a3a7200 70%),radial-gradient(60% 40% at 8% 80%,#4a1639 0,#4a163900 70%),linear-gradient(180deg,#722b5d,#561b44)}
.nav,.bar{background:#ffffff26;border-color:#ffffff40;color:#fff;box-shadow:0 10px 30px #2a0c2159,inset 0 1px 0 #ffffff33}
.nav button{background:#ffffff2e;color:#fff}
.nav .code{background:#ffffff33;color:#fff}
.bar button{color:#ffffffe6}
.bar .on{background:#ffffff40;color:#fff}
.bar .on:after{background:#ffc2e2}

/* theme-able background */
body{background:var(--bg,#cfc6b9)}
body:before{background:radial-gradient(70% 45% at 80% 6%,color-mix(in srgb,var(--bg,#cfc6b9) 70%,#fff) 0,transparent 70%),radial-gradient(60% 40% at 8% 80%,color-mix(in srgb,var(--bg,#cfc6b9) 78%,#000) 0,transparent 70%),linear-gradient(180deg,color-mix(in srgb,var(--bg,#cfc6b9) 88%,#fff),color-mix(in srgb,var(--bg,#cfc6b9) 86%,#000))}
body[data-tone=light] .nav,body[data-tone=light] .bar{background:#ffffff4d;border-color:#ffffff80;color:#2b2621;box-shadow:0 10px 30px #46372826,inset 0 1px 0 #ffffff66}
body[data-tone=light] .nav button{background:#ffffff73;color:#2b2621}
body[data-tone=light] .nav .code{background:#ffffff66;color:#3b342c}
body[data-tone=light] .bar button{color:#3b342c}
body[data-tone=light] .bar .on{background:#ffffff8c;color:#1f1b16}
body[data-tone=light] .bar .on:after{background:#7ed321}
.tl{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#6b6258;margin:16px 0 2px}
#bgs{gap:12px}#bgs i{width:36px;height:36px}
.sw i.on{outline:2px solid #2b2621;outline-offset:2px}
.cust{display:flex;align-items:center;gap:10px;font-size:14px;margin:4px 0 6px}
.cust input{width:44px;height:32px;border:0;background:none;padding:0}

/* flat background + tabs */
body:before{display:none}
.tabs{display:flex;gap:6px;background:#ffffff80;padding:4px;border-radius:14px;margin:10px 0 4px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font:inherit;font-size:14px;cursor:pointer;color:#6b6258}
.tabs .on{background:#fff;color:#2b2621;font-weight:600;box-shadow:0 1px 4px #0001}
[hidden]{display:none!important}

/* unified paper + dock, softer shade */
:root{--ink:#44403c}
body{padding-bottom:0}
.paper{border-color:#0000000d;box-shadow:0 1px 3px #0000000d,0 12px 36px #00000014}
.dock{pointer-events:auto;left:50%;right:auto;transform:translateX(-50%);width:min(var(--pw,360px),100vw);padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));gap:2px;background:#fffdf9;border-top:1px solid #0000000f}
.dock>*{max-width:none}
html body[data-tone] .dock .nav,html body[data-tone] .dock .bar{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;color:#44403c}
html body[data-tone] .dock .nav button{background:#f3f0ea;color:#44403c}
html body[data-tone] .dock .nav .code{background:#f3f0ea;color:#44403c}
html body[data-tone] .dock .bar button{color:#5a544d}
html body[data-tone] .dock .bar .on{background:#f1ede6;color:#2b2621}
html body[data-tone] .dock .bar .on:after{background:#7ed321}

/* AI edit chat */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
.chip2{border:1px solid #78645033;background:#fff;border-radius:99px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;color:#44403c}
.chat{max-height:32vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:8px 0}
.b{padding:10px 12px;border-radius:14px;font-size:14px;max-width:88%;white-space:pre-wrap;line-height:1.45}
.b.u{align-self:flex-end;background:var(--a);color:#fff}
.b.a{align-self:flex-start;background:#fff}
.row{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
.row textarea{width:auto;flex:1;height:58px}
.btn.snd{width:auto;margin:0;padding:14px 20px;font-size:15px}
.btn.und{margin-top:8px;padding:10px;font-size:14px}

/* edit content sheet */
.add,.x{display:none!important}
.ed{cursor:pointer}
.pill:empty{display:none}
.sheet.edsheet{padding:0;max-height:76vh;display:flex;flex-direction:column;background:#fff;border-radius:28px 28px 0 0;max-width:560px;overflow:hidden}
.edh{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 8px}
.edh h3{margin:0;font-size:21px;font-weight:700}
.xb{width:46px;height:46px;border-radius:13px;border:1px solid #e3e3e8;background:#fff;font-size:26px;cursor:pointer;line-height:1;color:#14142b}
.etabs{display:flex;gap:2px;overflow-x:auto;background:#f6f6f4;margin:6px 18px 14px;padding:4px;border-radius:14px;scrollbar-width:none;flex:none}
.etabs button{flex:none;border:0;background:none;padding:10px 14px;border-radius:11px;font:inherit;font-size:15px;color:#555;cursor:pointer}
.etabs .on{background:#fff;color:#14142b;box-shadow:0 1px 4px #0001;font-weight:600}
.edb{overflow:auto;padding:0 18px calc(26px + env(safe-area-inset-bottom,0px));border-top:1px solid #eee;flex:1}
.fg{margin-top:16px}
.fl{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.fl label{font-size:15px;color:#333}
.fg input,.fg textarea,.br textarea,.addrow input{width:100%;border:1px solid #d9d9e0;border-radius:14px;padding:14px;font:inherit;font-size:16px;background:#fff;color:#14142b}
.fg textarea,.br textarea{height:auto;resize:vertical}
.rm{border:0;background:none;color:#d23a3a;font:inherit;font-size:13px;cursor:pointer;padding:4px 6px}
.br .rm{font-size:20px;padding:8px}
.addf{border:1px dashed #b9b9c4;background:#fafafa;border-radius:14px;padding:13px;font:inherit;font-size:15px;color:#444;width:100%;margin-top:14px;cursor:pointer}
.ic{border:1px solid #ececf0;border-radius:18px;padding:4px 14px 14px;margin-top:16px;background:#fcfcfb}
.ich{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.br{display:flex;gap:4px;align-items:flex-start;margin-bottom:8px}
.tog{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:15px;background:#f6f6f4;padding:12px 14px;border-radius:14px}
.tog input{width:44px;height:26px;accent-color:var(--a)}
.sk{display:inline-flex;align-items:center;gap:4px;background:var(--t);border-radius:99px;padding:6px 6px 6px 12px;margin:0 6px 8px 0;font-size:14px}
.sk button{border:0;background:#ffffffb3;border-radius:50%;width:24px;height:24px;cursor:pointer;color:#c33}
.addrow{display:flex;gap:8px;margin-top:6px}
.addrow .btn{width:auto;margin:0;padding:0 20px}
.pimg{width:100%;height:110px;border-radius:12px;background:var(--t) center/cover;display:grid;place-items:center;font-size:14px;color:#666;cursor:pointer}

/* edit sheet uses the same colors as the other sheets */
.sheet.edsheet{background:#f8f4eed9;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid #ffffff99;color:var(--ink)}
.edb{border-top-color:#7864501f}
.xb{background:#ffffffb3;border-color:#78645033;color:var(--ink)}
.etabs{background:#ffffff80}
.etabs button{color:#6b6258}
.etabs .on{background:#fff;color:var(--ink)}
.fg input,.fg textarea,.br textarea,.addrow input{background:#ffffffb3;border-color:#78645040;color:var(--ink)}
.addf{background:#ffffff8c;border-color:#78645055;color:#44403c}
.ic{background:#ffffff80;border-color:#7864502e}
.tog{background:#ffffff80}
.fl label{color:var(--ink)}

/* more layouts */
.lx{--g:#777}
.lx .sx{margin-top:18px}
.lx h4{margin:0 0 8px;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
.lx .it{margin-bottom:12px}
.lx .r1,.lx .r2{display:flex;justify-content:space-between;gap:10px}
.lx .r1{font-size:12.5px}.lx .r2{color:var(--g);font-size:11.5px}
.lx .dt{color:#999;font-size:10.5px;font-weight:400;white-space:nowrap}
.lx .ct{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--g)}
.lx .ct.col{flex-direction:column;gap:4px}.lx .ct.r{align-items:flex-end}
.lx .chip{display:inline-block;margin:0 6px 6px 0}
.lx .sm{font-size:11.5px;color:var(--g)}
.lx .tt{font-size:12.5px;margin-top:6px}
.lx h1{font-size:30px}
.l1{text-align:center}.l1 h1{font-family:Georgia,'Times New Roman',serif;font-weight:500;color:var(--a)}

.l2 .sd .chip{background:#fff;border-color:#0000}
.paper[data-l="1"]{background:linear-gradient(90deg,#fffdf9 63.6%,var(--t) 0)}

.l3 h1{font-family:Georgia,serif;font-weight:500}.l3 .tt{color:var(--a);font-family:Georgia,serif;font-style:italic}
.l3 .ct{justify-content:center;margin-top:6px}.l3 .ct i{font-style:normal;color:#bbb}
.l3 .sx{display:grid;grid-template-columns:105px 1fr;border-bottom:1px solid #eee;padding:12px 0;margin:0}
.l3 h4{font:400 12.5px Georgia,serif;text-transform:none;letter-spacing:0;color:var(--ink)}
.l4 .hd{display:flex;justify-content:space-between;align-items:baseline}.l4 h1{font-size:24px}.l4 .tt{color:var(--a);font-weight:600}
.l4 .ct{justify-content:space-between;border-bottom:2px solid var(--a);padding:6px 0 8px}
.l4 .cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}.l4 h4{color:var(--a)}
.l5 .hd{display:flex;justify-content:space-between;border-bottom:1px solid #e6e6ee;padding-bottom:14px}
.l5 .tt{color:var(--a)}.l5 h1{font-size:26px}
.l5 .sx{display:grid;grid-template-columns:120px 1fr}.l5 h4{color:var(--a)}
.l5 .s-exp .it{border-left:1px solid var(--a);padding-left:14px;position:relative}
.l5 .s-exp .it:before{content:'';position:absolute;left:-4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--a)}
.l6 .top{display:grid;grid-template-columns:1fr 3fr;gap:20px;padding-bottom:20px}
.l6 h1{font-size:38px;font-weight:800;letter-spacing:-.02em}.l6 .tt{color:var(--a);font-size:14px;margin:10px 0}
.l6 .sx{display:grid;grid-template-columns:1fr 3fr;gap:20px;border-top:1px solid #333;padding-top:12px;margin-top:16px}.l6 h4{color:var(--a)}
.l7{display:grid;grid-template-columns:31% 1fr;margin:-46px -46px -60px}
.l7 .sd{padding:46px 22px}.l7 .mn{padding:46px 30px}.l7 h1{font-size:21px;line-height:1.2}
.l7 .av{width:46px;height:46px;border-radius:50%;background:var(--a);margin-bottom:14px}
.l7 .sd .chip{background:#fff;border-color:#0000;display:table}
.l7 .mn h4{color:var(--a);text-transform:none;letter-spacing:0;font-size:14px}
